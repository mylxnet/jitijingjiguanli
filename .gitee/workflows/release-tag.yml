name: 版本标签发布
on:
  push:
    tags:
      - v*
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 登录 Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: 构建 Docker 镜像
        run: |
          docker build -f deploy/Dockerfile.local \
            -t mylxnet/jititaizhang:${{ GITEE_TAG_NAME }} \
            -t mylxnet/jititaizhang:latest \
            .

      - name: 推送到 Docker Hub
        run: |
          docker push mylxnet/jititaizhang:${{ GITEE_TAG_NAME }}
          docker push mylxnet/jititaizhang:latest