name: build-release

# 打 v* 标签推送时，构建单文件可执行程序并发布到 GitHub Releases。
# 产物：Linux amd64（jitizhang，监听 :8080）+ Windows amd64 桌面版（jititaizhang.exe，双击即用）。
# 两者都内嵌前端产物与纯 Go SQLite 驱动，目标机无需额外运行时。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取版本号
        id: ver
        # 版本号唯一来源是 web/src/version.ts，供 Windows PE 版本资源使用。
        run: echo "version=$(sed -n "s/.*APP_VERSION = '\(.*\)'.*/\1/p" web/src/version.ts)" >> "$GITHUB_OUTPUT"

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 构建前端 (跳过 vue-tsc 类型检查)
        working-directory: web
        run: |
          npm ci
          npx vite build

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: 复制前端产物到内嵌目录
        run: |
          rm -rf server/cmd/server/web
          mkdir -p server/cmd/server/web
          cp -r web/dist/. server/cmd/server/web/

      - name: 编译后端 (Linux amd64)
        working-directory: server
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: go build -o ../jitizhang ./cmd/server

      - name: 生成 Windows 资源 (图标 + 版本信息)
        working-directory: server
        # go-winres 生成 rsrc_windows_amd64.syso，Go 构建 Windows 目标时自动链接；
        # 版本号取自 web/src/version.ts，避免 PE 版本资源与 APP_VERSION 脱节。
        run: |
          go run github.com/tc-hib/go-winres@v0.3.3 make \
            --in cmd/server/winres/winres.json \
            --arch amd64 \
            --out cmd/server/rsrc \
            --file-version "${{ steps.ver.outputs.version }}" \
            --product-version "${{ steps.ver.outputs.version }}"

      - name: 交叉编译 Windows amd64 (桌面单文件)
        working-directory: server
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p ../dist/windows
          go build -trimpath -ldflags="-s -w" -o ../dist/windows/jititaizhang.exe ./cmd/server

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            jitizhang
            dist/windows/jititaizhang.exe
          generate_release_notes: true