# 从 Docker Hub 拉取预构建镜像（无需本地构建）
# 用法：
#   1. 先在本地构建并推送：docker push 你的用户名/jititaizhang:版本号
#   2. 在 NAS 上运行：
#      docker compose -f docker-compose.hub.yml up -d
#
# 首次需先 docker login，然后改下面 image 为你的仓库地址

services:
  jititaizhang:
    image: 你的用户名/jititaizhang:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ${APP_BACKUP_DIR:-./backups}:/backups
    environment:
      - APP_PORT=8080
      - DATA_DIR=/data
      - APP_BACKUP_DIR=/backups
      - APP_KEEP_BACKUP=${APP_KEEP_BACKUP:-30}
      - APP_AUTO_BACKUP=${APP_AUTO_BACKUP:-1}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3