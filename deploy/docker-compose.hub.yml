# 直接拉取已构建好的公共镜像（无需本地构建）
# 镜像发布在阿里云容器镜像服务（ACR，杭州）：
#   registry.cn-hangzhou.aliyuncs.com/mylxnet/jitijingjiguanli:<版本号>
#   同时维护 latest 标签；升级到某个版本只需改下面 image 的标签。
# 用法：
#   1. 先登录（凭据不入库）：docker login registry.cn-hangzhou.aliyuncs.com
#   2. 在本目录运行：docker compose -f docker-compose.hub.yml up -d
#      升级：docker compose -f docker-compose.hub.yml pull && docker compose -f docker-compose.hub.yml up -d
#   ⚠️ 换镜像/替换挂载的库文件后必须重启容器：数据库迁移只在进程启动时执行一次
#
# 若要用自建仓库，改下面 image 为你的仓库地址即可

services:
  jititaizhang:
    image: registry.cn-hangzhou.aliyuncs.com/mylxnet/jitijingjiguanli:v0.24.1
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ${APP_BACKUP_DIR:-./backups}:/backups
    environment:
      - APP_PORT=8080
      - DATA_DIR=/data
      - APP_BACKUP_DIR=/backups
      - APP_KEEP_BACKUP=${APP_KEEP_BACKUP:-30}
      - APP_AUTO_BACKUP=${APP_AUTO_BACKUP:-1}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3