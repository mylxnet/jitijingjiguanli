# ============================================================
# 集体台账 - Docker Compose 部署配置（飞牛 NAS）
#
# 前置步骤：
#   1. 把 jititaizhang-docker.tar 拷到 NAS
#   2. 在 compose 文件目录执行：docker load -i jititaizhang-docker.tar
#   3. 启动：docker compose up -d
#
# 常用命令：
#   docker compose up -d         启动
#   docker compose ps            查看状态
#   docker compose logs -f       查看日志
#   docker compose down          停止并移除容器（数据保留）
#   docker compose restart       重启
#
# 访问地址：http://<NAS的IP>:1133
# ============================================================

services:
  jititaizhang:
    # 本地已加载的镜像（不使用 build，避免每次联网拉取）
    # 升级到新版本：先 docker load -i jititaizhang-docker-vX.Y.Z.tar，再把下面 tag 改为对应版本号
    image: jititaizhang:v0.14.0
    container_name: jititaizhang
    restart: unless-stopped
    ports:
      # 宿主机 1133 端口 → 容器 8080 端口
      - "1133:8080"
    volumes:
      # 数据与备份必须挂载到 NAS 存储池，避免容器重建丢失数据
      - ./data:/data
      - ./backups:/backups
    environment:
      - APP_PORT=8080
      - DATA_DIR=/data
      - APP_BACKUP_DIR=/backups
      - APP_KEEP_BACKUP=30
      - APP_AUTO_BACKUP=1
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s