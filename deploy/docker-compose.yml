services:
  jititaizhang:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: jititaizhang:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ${APP_BACKUP_DIR:-./backups}:/backups
    environment:
      - APP_PORT=8080
      - DATA_DIR=/data
      - APP_BACKUP_DIR=/backups
      - APP_KEEP_BACKUP=${APP_KEEP_BACKUP:-30}
      - APP_AUTO_BACKUP=${APP_AUTO_BACKUP:-1}
    # 健康检查
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3